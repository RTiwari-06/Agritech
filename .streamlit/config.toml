# Fieldnote — warm, editorial market workspace
[theme]
base = "light"
primaryColor = "#287D58"
backgroundColor = "#F5F7F2"
secondaryBackgroundColor = "#FFFFFF"
codeBackgroundColor = "#EEF2EB"
textColor = "#1F352B"
linkColor = "#287D58"
borderColor = "#DCE5DD"
codeTextColor = "#325143"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "12px"
buttonRadius = "10px"
font = "sans serif"
headingFont = "sans serif"
codeFont = "monospace"
baseFontSize = 15
baseFontWeight = 400
headingFontSizes = ["32px", "26px", "21px", "18px", "15px", "13px"]
headingFontWeights = [700, 700, 600, 600, 500, 500]
linkUnderline = false

greenColor = "#287D58"
redColor = "#B5473C"
yellowColor = "#9A6E08"
orangeColor = "#B65B2B"
blueColor = "#3976A8"
violetColor = "#7454A1"
grayColor = "#66766D"

chartCategoricalColors = [
    "#287D58",
    "#3976A8",
    "#B65B2B",
    "#7454A1",
    "#9A6E08",
    "#2D8A83",
    "#B5473C",
    "#66766D",
]

chartSequentialColors = [
    "#F0F6EF",
    "#DCEBDD",
    "#C5DFC9",
    "#A6D0B2",
    "#82BD98",
    "#5AA67B",
    "#3D9065",
    "#287D58",
    "#1F6649",
    "#174C38",
]

dataframeBorderColor = "#DCE5DD"
dataframeHeaderBackgroundColor = "#EEF3ED"

[theme.sidebar]
backgroundColor = "#EDF2EB"
secondaryBackgroundColor = "#FFFFFF"
codeBackgroundColor = "#E5ECE4"
textColor = "#1F352B"
borderColor = "#DCE5DD"
primaryColor = "#287D58"
